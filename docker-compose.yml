services:
  # ─── Next.js App (YNot Solutions) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ynot-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4001
    expose:
      - "4001"
    networks:
      - web

networks:
  web:
    external: true
